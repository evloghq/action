name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  major-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Move the major tag to this release
        run: |
          major="${GITHUB_REF_NAME%%.*}"
          git config user.name github-actions
          git config user.email github-actions@github.com
          git tag -f "$major" "$GITHUB_REF_NAME"
          git push -f origin "$major"
      # The Marketplace listing follows GitHub Releases, not tags.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
