name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: npm run check
      - run: npm test

  single-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - id: map
        uses: ./
        with:
          working-directory: test/fixtures/nuxt-app
          min-score: 40
          baseline: none
          annotations: false
          comment: on-failure
      - name: Outputs are the fixture's numbers
        env:
          OUTPUTS: ${{ toJSON(steps.map.outputs) }}
        run: |
          echo "$OUTPUTS" | jq .
          test "$(echo "$OUTPUTS" | jq -r .passed)" = "true"
          test "$(echo "$OUTPUTS" | jq -r .instrumented)" = "2"
          test "$(echo "$OUTPUTS" | jq -r .dark)" = "2"
          test "$(echo "$OUTPUTS" | jq -r '.results | fromjson | length')" = "1"
          test "$(echo "$OUTPUTS" | jq -r '.results | fromjson | .[0].framework')" = "nuxt"

  monorepo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - id: map
        uses: ./
        with:
          packages: |
            test/fixtures/*
          limit: 3
          baseline: none
          annotations: false
          comment: false
      - name: Every fixture package is scanned, the non-package is not
        env:
          OUTPUTS: ${{ toJSON(steps.map.outputs) }}
        run: |
          echo "$OUTPUTS" | jq .
          test "$(echo "$OUTPUTS" | jq -r '.results | fromjson | map(.name) | join(",")')" = "test/fixtures/express-app,test/fixtures/hono-app,test/fixtures/nuxt-app"
          test "$(echo "$OUTPUTS" | jq -r '.results | fromjson | map(.framework) | join(",")')" = "express,hono,nuxt"
          test "$(echo "$OUTPUTS" | jq -r .passed)" = "true"

  report-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - id: map
        uses: ./
        with:
          working-directory: test/fixtures/nuxt-app
          min-score: 100
          gate: false
          annotations: false
          comment: false
          baseline: none
      - name: The step stays green and says the gate would have failed
        env:
          OUTPUTS: ${{ toJSON(steps.map.outputs) }}
        run: |
          echo "$OUTPUTS" | jq .
          test "$(echo "$OUTPUTS" | jq -r .passed)" = "false"
          test "$(echo "$OUTPUTS" | jq -r .delta)" = ""
          test "$(echo "$OUTPUTS" | jq -r '.results | fromjson | .[0].reasons[0]')" = "below --min-score 100"

  gate-fails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - id: map
        continue-on-error: true
        uses: ./
        with:
          working-directory: test/fixtures/nuxt-app
          min-score: 100
          annotations: false
          comment: false
          baseline: none
      - name: The step failed, and the outputs were still written
        env:
          OUTCOME: ${{ steps.map.outcome }}
          OUTPUTS: ${{ toJSON(steps.map.outputs) }}
        run: |
          test "$OUTCOME" = "failure"
          test "$(echo "$OUTPUTS" | jq -r .passed)" = "false"
          test -n "$(echo "$OUTPUTS" | jq -r .score)"

  bad-input:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - id: map
        continue-on-error: true
        uses: ./
        with:
          working-directory: test/fixtures/nuxt-app
          min-score: 150
      - name: A bad input fails before anything is scanned
        env:
          OUTCOME: ${{ steps.map.outcome }}
          OUTPUTS: ${{ toJSON(steps.map.outputs) }}
        run: |
          test "$OUTCOME" = "failure"
          test "$(echo "$OUTPUTS" | jq -r '.score // empty')" = ""

  baseline:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - id: map
        continue-on-error: true
        uses: ./
        with:
          packages: |
            test/fixtures/*
      - name: The base was scanned and compared
        env:
          OUTPUTS: ${{ toJSON(steps.map.outputs) }}
        run: |
          echo "$OUTPUTS" | jq .
          test -n "$(echo "$OUTPUTS" | jq -r .delta)"
          echo "$OUTPUTS" | jq -e '.results | fromjson | all(has("delta"))'



  cards:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - id: map
        continue-on-error: true
        uses: ./
        with:
          packages: |
            test/fixtures/*
          # The preview of evloghq/evlog#1075, which writes the `event` key the
          # card reads. Back to the default once a release carries it.
          version: https://pkg.pr.new/@evlog/cli@1075
          cards-url: https://evlog-cloud.vercel.app
          comment: true
          comment-key: cards
          annotations: false
      - name: The app stored the run and the comment links to it
        env:
          CARDS_URL: ${{ steps.map.outputs.cards-url }}
        run: |
          echo "$CARDS_URL"
          case "$CARDS_URL" in https://evlog-cloud.vercel.app/r/*) ;; *) exit 1 ;; esac
          curl -fsS -o /dev/null -w '%{content_type}\n' "$CARDS_URL/report.svg" | grep -q 'image/svg+xml'

  telemetry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: node test/telemetry-integration.mjs

  telemetry-disabled:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - id: map
        uses: ./
        env:
          EVLOG_TELEMETRY: '1'
        with:
          telemetry: false
          working-directory: test/fixtures/nuxt-app
          baseline: none
          annotations: false
          comment: false
      - name: Opt-out leaves scanning and outputs intact
        env:
          PASSED: ${{ steps.map.outputs.passed }}
          INSTRUMENTED: ${{ steps.map.outputs.instrumented }}
        run: |
          test "$PASSED" = "true"
          test "$INSTRUMENTED" = "2"
